name: Daily Screener Update

on:
  schedule:
    # Run every Monday to Friday at 2:10 PM UTC (7:40 PM IST)
    # Using an off-peak minute (:10) bypasses GitHub Actions queue congestion
    - cron: '10 14 * * 1-5'
  workflow_dispatch: # Enable manual triggers anytime from GitHub Actions UI

jobs:
  update-screener:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: sudo apt-get install -y unzip

      - name: Run Indicator Unit Tests
        run: node --test test/indicators.test.js

      - name: Run Screener Generator (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            node scripts/update_data.js && echo "Success on attempt $attempt" && break
            if [ $attempt -eq 3 ]; then
              echo "All 3 attempts failed. Exiting."
              exit 1
            fi
            echo "Attempt $attempt failed. Retrying in 30 seconds..."
            sleep 30
          done

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/send_telegram_notification.js || echo "Telegram notification failed, continuing workflow."

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Write a heartbeat timestamp to keep repo active
          echo "Last successful run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/last_updated.txt

          git add data/screener.json data/breakout_history.json .github/last_updated.txt

          # If screener.json changed, use a descriptive message; otherwise heartbeat
          if git diff --cached --quiet -- data/screener.json; then
            git commit -m "ci: heartbeat keep-alive [skip ci]"
          else
            git commit -m "Auto-update market data $(date -u '+%Y-%m-%d') [skip ci]"
          fi
          git push
